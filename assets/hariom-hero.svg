<text x="24" y="82" fill="#34d399" font-family="monospace" font-size="15">$ git status --short</text><text x="24" y="110" fill="#c4b5fd" font-family="monospace" font-size="14">M  Haryomix</text><text x="24" y="136" fill="#7dd3fc" font-family="monospace" font-size="14">A  Hariom AI</text><text x="24" y="162" fill="#fcd34d" font-family="monospace" font-size="14">→  build · test · improve</text><path d="M24 185H416" stroke="#1e293b"/><text x="24" y="210" fill="#64748b" font-family="monospace" font-size="12">STATUS: BUILDING IN PUBLIC</text></g>
