ace" font-size="24" font-weight="700">03 / KOMIO</text><text x="22" y="76" fill="#e2e8f0" font-family="sans-serif" font-size="18">Local-first workspace · Guarded tools</text><text x="22" y="112" fill="#94a3b8" font-family="monospace" font-size="16">PYTHON / JAVASCRIPT / SQLITE</text><text x="22" y="145" fill="#fde68a" font-family="monospace" font-size="16">PLAN → REVIEW → VERIFY</text></g><g transform="translate(20 610)"><rect width="560" height="190" rx="14" fill="#0b1422" stroke="#0f766e"/><rect width="560" height="5" rx="2" fill="#34d399"/><text x="22" y="40" fill="#6ee7b7" font-family="monospace" font-size="24" font-weight="700">04 / TOUR RECORDER</text><text x="22" y="76" fill="#e2e8f0" font-family="sans-serif" font-size="18">Automated website tours</text><text x="22" y="112" fill="#94a3b8" font-family="monospace" font-size="16">PYTHON / PLAYWRIGHT / FFMPEG</text><text x="22" y="151" fill="#a7f3d0" font-family="monospace" font-size="16">CONFIGURE → RECORD → EXPORT</text></g></svg>